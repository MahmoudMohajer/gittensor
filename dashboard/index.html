<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gittensor Opportunity Finder</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header>
            <div class="logo">
                <h1>Gittensor <span class="highlight">Opportunities</span></h1>
            </div>
            <nav class="nav-links">
                <a href="/" class="nav-link active">Opportunities</a>
                <a href="/competitors" class="nav-link">Competitors</a>
            </nav>
        </header>
        <div class="stats">
            <div class="stat-card">
                <span class="stat-label">Total Issues</span>
                <span class="stat-value" id="total-issues">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Top Repo Weight</span>
                <span class="stat-value" id="top-weight">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Easy Issues</span>
                <span class="stat-value" id="easy-issues">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Last Updated</span>
                <span class="stat-value" id="last-updated">-</span>
            </div>
        </div>
        </header>

        <main>
            <div class="controls">
                <input type="text" id="search" placeholder="Search repositories or issues..." class="search-bar">

                <div class="range-filter">
                    <input type="number" id="min-age" placeholder="Min Days" class="range-input">
                    <span>-</span>
                    <input type="number" id="max-age" placeholder="Max Days" class="range-input">
                </div>

                <div class="filters">
                    <button class="filter-btn active" data-sort="weight">Sort by Weight</button>
                    <button class="filter-btn" data-sort="age">Sort by Age</button>
                    <button class="filter-btn" data-sort="difficulty">Sort by Difficulty</button>
                </div>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Repository</th>
                            <th>Weight</th>
                            <th>Issue</th>
                            <th>Difficulty</th>
                            <th>Age</th>
                            <th>Potential Score</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="issues-body">
                        <!-- Issues will be injected here -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>

</html>
